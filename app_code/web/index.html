<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta name="google-signin-client_id" content="1085697654596-l9jihcikn9rut9n84t30a6k9veh2tv0k.apps.googleusercontent.com">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app_code">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>app_code</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Google Identity Services Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- Google Sign-In Button Container -->
  <div id="g_id_onload"
       data-client_id="1085697654596-l9jihcikn9rut9n84t30a6k9veh2tv0k.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <script>
    window.handleCredentialResponse = function(response) {
      // This will be called when the user authenticates via Google Sign-In button
      // The response.credential contains the JWT token
      if (window.googleSignInCallback) {
        window.googleSignInCallback(response.credential);
      }
    };
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
